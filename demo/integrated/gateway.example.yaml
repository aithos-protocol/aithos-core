# Secret-free template for the browser G4 + Google Sheets + Gmail demonstration.
# Replace every ${...} before starting the gateway. Secrets stay in Vault or
# environment variables named by the configuration; never inline them here.
listen: 127.0.0.1:4870

dashboard:
  allowed_origins:
    - http://127.0.0.1:3000

credential_brokers:
  enterprise:
    kind: vault-kv2
    address: http://127.0.0.1:8200
    mount: secret
    auth: { kind: token-env, env: AITHOS_DEMO_VAULT_TOKEN }

# The hub shape is required by connector profiles. The compiled Sheets
# connector is materialized dynamically; this inert server grants no tool.
servers:
  - name: bootstrap
    transport: http
    url: http://127.0.0.1:9/mcp

contexts:
  - name: operations
    store:
      kind: remote
      url: http://127.0.0.1:4880
      tenant: ${AITHOS_DEMO_TENANT}
      did: ${AITHOS_DEMO_DID}
      mandate: [${AITHOS_DEMO_AGENT_MANDATE}]
      local: ${AITHOS_DEMO_STATE}/context-sidecar
    tools: {}

# Runtime-created Ethos inherit only these Provider coordinates. Their DID,
# mandate ids and exact Gateway identity binding come from the signed browser
# enrollment; tools/connectors start empty and are restored/equipped separately.
ethos_catalog:
  root: ${AITHOS_DEMO_STATE}/ethos-catalog
  template_context: operations
  audience: http://127.0.0.1:4870/mcp
  enrollment_authority_contexts: [operations]
  max_contexts: 256

journal:
  store: { kind: fs, root: ${AITHOS_DEMO_STATE}/journal }

as:
  profile: production
  issuer: http://127.0.0.1:4870
  key_file: ${AITHOS_DEMO_STATE}/as.key
  access_ttl_secs: 900
  refresh_ttl_secs: 28800
  redirect_allowlist:
    - http://127.0.0.1:3000/delegation
  state:
    address: http://127.0.0.1:8200
    mount: secret
    prefix: aithos/demo/as
    token_env: AITHOS_DEMO_AS_VAULT_TOKEN

connector_profiles:
  - id: google-sheets-read
    version: "1"
    enabled: true
    risk: read
    execution:
      kind: compiled_rest
      adapter: google_sheets_read
      api_base_url: https://sheets.googleapis.com/
      manifest_id: google-sheets-read
      manifest_pin: ${AITHOS_DEMO_SHEETS_MANIFEST_PIN}
      settings:
        kind: google_sheets_read
        allowed_ranges:
          ${AITHOS_DEMO_SPREADSHEET_ID}:
            - "${AITHOS_DEMO_SHEET_RANGE}"
        max_response_bytes: 524288
    oauth:
      credential_broker: enterprise
      auth_url: https://accounts.google.com/o/oauth2/v2/auth
      token_url: https://oauth2.googleapis.com/token
      client_id: ${AITHOS_DEMO_GOOGLE_CLIENT_ID}
      scopes:
        - openid
        - email
        - https://www.googleapis.com/auth/spreadsheets.readonly
      redirect_uri: http://127.0.0.1:4870/oauth/callback
      client_authentication: client_secret_post
      registration: { strategy: static }
      authorization_parameters:
        access_type: offline
        include_granted_scopes: true
        prompt_consent_on_repair: true
      revocation_url: https://oauth2.googleapis.com/revoke
      account_binding:
        issuer: https://accounts.google.com
        source:
          kind: user_info
          endpoint: https://openidconnect.googleapis.com/v1/userinfo
        subject_field: sub
        account_field: email

  # Companion to Google's official Gmail MCP. It runs inside the Gateway and
  # exposes only the approval-gated REST send operation.
  - id: aithos-gmail
    version: "1"
    enabled: true
    risk: guarded_write
    execution:
      kind: compiled_rest
      adapter: gmail_send_guarded
      api_base_url: https://gmail.googleapis.com/
      manifest_id: aithos-gmail
      manifest_pin: ${AITHOS_DEMO_GMAIL_MANIFEST_PIN}
      settings:
        kind: gmail_send_guarded
        allowed_recipients:
          - ${AITHOS_DEMO_GMAIL_ALLOWED_RECIPIENT}
        allowed_domains: []
        max_recipients: 1
        max_subject_bytes: 200
        max_body_bytes: 65536
        approval_ttl_seconds: 900
    oauth:
      credential_broker: enterprise
      auth_url: https://accounts.google.com/o/oauth2/v2/auth
      token_url: https://oauth2.googleapis.com/token
      client_id: ${AITHOS_DEMO_GOOGLE_CLIENT_ID}
      scopes:
        - openid
        - email
        - https://www.googleapis.com/auth/gmail.send
      redirect_uri: http://127.0.0.1:4870/oauth/callback
      client_authentication: client_secret_post
      registration: { strategy: static }
      authorization_parameters:
        access_type: offline
        include_granted_scopes: true
        prompt_consent_on_repair: true
      revocation_url: https://oauth2.googleapis.com/revoke
      account_binding:
        issuer: https://accounts.google.com
        source:
          kind: user_info
          endpoint: https://openidconnect.googleapis.com/v1/userinfo
        subject_field: sub
        account_field: email
