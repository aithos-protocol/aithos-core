# Piste P — image store-api (lot P1). Teste le crate (dont le rejeu
# octet-exact des vecteurs p1 contre le binaire réel), construit le
# binaire statique (docker/store-api.Dockerfile, FROM scratch), pousse
# `:prod` + `:<sha>` dans l'ECR provider et force un redéploiement.
#
# Rôle OIDC `provider-deploy` (environnement GitHub épinglé, zéro
# credential longue durée) : push ECR + UpdateService, rien d'autre —
# ce workflow ne touche NI Terraform NI l'état (l'apply infra est manuel,
# par Mathieu, après lecture du plan).
name: Provider store-api image

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "rust/crates/aithos-provider/**"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "docker/store-api.Dockerfile"
      - "vectors/p1-store-envelope.json"
      - ".github/workflows/provider-image.yml"

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Tests du crate (BDD + rejeu des vecteurs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test -p aithos-provider
        run: cargo test -p aithos-provider --manifest-path rust/Cargo.toml

  push:
    name: Build + push + redeploy (prod)
    needs: test
    runs-on: ubuntu-latest
    environment: provider-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_PROVIDER_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Require deployment configuration
        run: |
          test -n "${{ vars.PROVIDER_ECR_REPOSITORY }}"
          test -n "${{ vars.PROVIDER_ECS_CLUSTER }}"
          test -n "${{ vars.PROVIDER_ECS_SERVICE }}"
      - name: Login to ECR
        run: |
          aws ecr get-login-password --region "${{ vars.AWS_REGION }}" \
            | docker login --username AWS --password-stdin \
              "$(echo "${{ vars.PROVIDER_ECR_REPOSITORY }}" | cut -d/ -f1)"
      - name: Build static image (FROM scratch)
        run: |
          docker build -f docker/store-api.Dockerfile \
            -t "${{ vars.PROVIDER_ECR_REPOSITORY }}:prod" \
            -t "${{ vars.PROVIDER_ECR_REPOSITORY }}:${GITHUB_SHA}" \
            .
      - name: Push
        run: |
          docker push "${{ vars.PROVIDER_ECR_REPOSITORY }}:prod"
          docker push "${{ vars.PROVIDER_ECR_REPOSITORY }}:${GITHUB_SHA}"
      - name: Redeploy the service on the fresh :prod tag
        run: |
          aws ecs update-service \
            --cluster "${{ vars.PROVIDER_ECS_CLUSTER }}" \
            --service "${{ vars.PROVIDER_ECS_SERVICE }}" \
            --force-new-deployment >/dev/null
          aws ecs wait services-stable \
            --cluster "${{ vars.PROVIDER_ECS_CLUSTER }}" \
            --services "${{ vars.PROVIDER_ECS_SERVICE }}"
