[workspace]
resolver = "2"
members = [
    "crates/aithos-core",
    "crates/aithos-bundle",
    "crates/aithos-cli",
    "crates/aithos-owner",
    "crates/aithos-wasm",
    "crates/aithos-gateway",
    "crates/aithos-provider",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/aithos-protocol/aithos-core"

[workspace.dependencies]
# crypto — audited, spec §00.3
blake3 = "1"
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
# default-features off: the core never draws RNG (entropy is injected);
# getrandom must stay out of the wasm32 graph (K pass, 2026-07-11)
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = "0.12"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
security-framework = "3.7"

# encoding / ids
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"
bs58 = "0.5"
hex = "0.4"
ulid = { version = "1", default-features = false }

# CLI surface tests (dev-only, decided 2026-07-10)
assert_cmd = "2"
predicates = "3"
tempfile = "3"

# surfaces
thiserror = "1"
clap = { version = "4", features = ["derive"] }
wasm-bindgen = "0.2"

# acceptance (BDD)
cucumber = "0.21"
futures = "0.3"

# perf targets §09.3 (dev-only)
criterion = { version = "0.5", default-features = false }

# gateway runtime (decided 2026-07-10: Streamable HTTP first, OpenAI-compat LLM stub)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# OLR-0 (2026-07-22): standard OAuth/OIDC clients for the upstream
# protocol seam. Kept rustls-only. `oauth2` is wired in aithos-gateway;
# `openidconnect` stays optional until OLR-3.
oauth2 = { version = "5.0.0", default-features = false, features = ["reqwest", "rustls-tls"] }
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_yaml = "0.9"

# provider service (piste P, lot P1 — INFRA-PROVIDER annexes A/B/C);
# the path dep lets the gateway's P3 e2e run the REAL service in-process
aithos-provider = { path = "crates/aithos-provider" }
base64 = "0.22"
url = "2"
# P3 RemoteStore client (aithos-bundle feature `remote`, arbitrage ①
# 2026-07-21): minimal BLOCKING http client for a sync lib — no async
# runtime imposed on aithos-bundle consumers; rustls only, never a C TLS.
ureq = { version = "3", default-features = false, features = ["rustls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
aws-config = "1"
aws-sdk-dynamodb = "1"
aws-sdk-s3 = "1"
# P5 witness service (lot A): the KMS native Ed25519 sign-only key (annexe
# C.1) and the heads-table stream that carries the C.2 publish trigger
aws-sdk-kms = "1"
aws-sdk-dynamodbstreams = "1"
tower = "0.5"

# relay passthrough (piste P, lot P6 jalon M2 — INFRA-PROVIDER annexe B):
# the tunnel door terminates its OWN TLS (rustls/ring — no aws-lc C build on
# the hot path), yamux multiplexes the pod tunnel, tokio-util bridges the
# yamux futures-io streams to tokio. rcgen mints test/dev certificates.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
yamux = "0.13"
tokio-util = { version = "0.7", features = ["compat"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "crypto"] }
# TCP keepalive on the pod tunnel socket, both sides (redline B.3, M2:
# EOF detection + TCP keepalive; applicative PING = draft.2)
socket2 = "0.5"
# delegated ACME DNS-01 (annexe B.5): the store writes the challenge TXT
aws-sdk-route53 = "1"
# pod-stub ACME mode (dev/e2e only, feature pod-stub): the CLIENT half of
# B.5 — obtains its own public cert, the key never leaves the pod (A3)
instant-acme = { version = "0.7", default-features = false, features = ["hyper-rustls", "ring"] }

# internal
aithos-core = { version = "0.1.0-alpha.1", path = "crates/aithos-core" }
aithos-bundle = { version = "0.1.0-alpha.1", path = "crates/aithos-bundle" }
aithos-owner = { version = "0.1.0-alpha.1", path = "crates/aithos-owner" }
aithos-wasm = { version = "0.1.0-alpha.1", path = "crates/aithos-wasm" }
# Offline Ethos engine. The path resolves to the sibling development crate,
# whose own core/bundle dependencies resolve back to the exact workspace
# packages above; gate 3 pins this with `cargo tree` before any runtime use.
aithos-client = { version = "0.1.0-alpha.2-dev", path = "../../aithos-client/crates/aithos-client" }

[profile.release]
lto = true
codegen-units = 1
strip = true
