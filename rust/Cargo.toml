[workspace]
resolver = "2"
members = [
    "crates/aithos-core",
    "crates/aithos-bundle",
    "crates/aithos-cli",
    "crates/aithos-wasm",
    "crates/aithos-gateway",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# crypto — audited, spec §00.3
blake3 = "1"
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
# default-features off: the core never draws RNG (entropy is injected);
# getrandom must stay out of the wasm32 graph (K pass, 2026-07-11)
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = "0.12"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }

# encoding / ids
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"
bs58 = "0.5"
hex = "0.4"
ulid = { version = "1", default-features = false }

# CLI surface tests (dev-only, decided 2026-07-10)
assert_cmd = "2"
predicates = "3"
tempfile = "3"

# surfaces
thiserror = "1"
clap = { version = "4", features = ["derive"] }
wasm-bindgen = "0.2"

# acceptance (BDD)
cucumber = "0.21"
futures = "0.3"

# perf targets §09.3 (dev-only)
criterion = { version = "0.5", default-features = false }

# gateway runtime (decided 2026-07-10: Streamable HTTP first, OpenAI-compat LLM stub)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_yaml = "0.9"

# internal
aithos-core = { path = "crates/aithos-core" }
aithos-bundle = { path = "crates/aithos-bundle" }

[profile.release]
lto = true
codegen-units = 1
strip = true
