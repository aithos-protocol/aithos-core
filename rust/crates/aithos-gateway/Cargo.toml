[package]
name = "aithos-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Containerised runner gateway: sits between an agent and its dependencies, enforces the mandate, logs every act to the gamma, and holds the keys the agent never sees"
publish = false

[dependencies]
# the trust engine, consumed as a library — only `core_bridge` (and its
# `store_adapter` seam) may import from these two crates
aithos-core = { workspace = true }
aithos-bundle = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true }
ulid = { workspace = true }

# transport (decided 2026-07-10: MCP Streamable HTTP first)
tokio = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }

# onboarding CLI
clap = { workspace = true }

[dev-dependencies]
cucumber = { workspace = true }
futures = { workspace = true }
tempfile = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }

[[test]]
name = "cucumber"
harness = false
