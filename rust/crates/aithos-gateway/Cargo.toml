[package]
name = "aithos-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Containerised runner gateway: sits between an agent and its dependencies, enforces the mandate, logs every act to the gamma, and holds the keys the agent never sees"
publish = false
default-run = "aithos-gateway"

[features]
default = []
olr-oauth-libs = ["dep:oauth2", "dep:openidconnect"]

[dependencies]
# the trust engine, consumed as a library — only `core_bridge` (and its
# `store_adapter` seam) may import from these two crates
aithos-core = { workspace = true }
# P3: the `remote` feature carries the RemoteStore client (wire A.2) —
# the gateway is its first consumer (store_adapter `remote`/`replicated`).
aithos-bundle = { workspace = true, features = ["remote"] }
aithos-owner = { workspace = true }
# Ethos-only offline planning engine. It is never part of generic MCP
# connector routing and performs no network I/O itself.
aithos-client = { workspace = true }

# OLR: Authorization Code + PKCE + refresh protocol engine (default path
# remains selectable via `protocol_engine: native|oauth2`). OIDC ID Token
# validation (OLR-3) uses openidconnect.
oauth2 = { workspace = true, optional = true }
openidconnect = { workspace = true, optional = true }

serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
ulid = { workspace = true }

# transport (MCP Streamable HTTP + opt-in G1 outbound relay)
tokio = { workspace = true, features = ["io-util", "time", "sync"] }
axum = { workspace = true }
reqwest = { workspace = true }
ureq = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }
yamux = { workspace = true }
tokio-util = { workspace = true }
socket2 = { workspace = true, features = ["all"] }
instant-acme = { workspace = true }
rcgen = { workspace = true }

# onboarding CLI
clap = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# P3 — the mode B/mode A e2e runs the REAL provider service in-process
# (acyclic: the provider never depends on the gateway).
aithos-provider = { workspace = true }
cucumber = { workspace = true }
tempfile = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }
chrono = { workspace = true }

[[test]]
name = "cucumber"
harness = false

[[test]]
name = "olr_oauth2_e2e"
required-features = ["olr-oauth-libs"]

[[test]]
name = "olr_oidc_e2e"
required-features = ["olr-oauth-libs"]
