[package]
name = "aithos-bundle"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Aithos Core bundle layout and storage — the only crate that touches I/O."
readme = "README.md"
keywords = ["aithos", "protocol", "bundle", "storage", "cryptography"]
categories = ["authentication", "cryptography", "filesystem"]

[dependencies]
aithos-core.workspace = true
blake3.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
ulid.workspace = true
x25519-dalek.workspace = true

[features]
# P3 — the RemoteStore client (INFRA-PROVIDER annexe A, consumed client
# side): HTTP + signed envelopes stay OUT of the default graph; the
# gateway (store_adapter `remote`) and the e2e harnesses opt in.
remote = ["dep:ureq", "dep:base64"]

[dependencies.ureq]
workspace = true
optional = true

[dependencies.base64]
workspace = true
optional = true

[dev-dependencies]
cucumber.workspace = true
futures.workspace = true
criterion.workspace = true

# BDD acceptance harness — features live at the repo root in features/.
[[test]]
name = "cucumber"
harness = false

# Perf targets of spec §09.3 — `cargo bench -p aithos-bundle`.
[[bench]]
name = "perf"
harness = false
