[package]
name = "aithos-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Thin WASM bindings over aithos-core — surface only, no logic. Packaged locally as @aithos/core; publishing is a separate, explicit decision."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aithos-core.workspace = true
wasm-bindgen.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_jcs.workspace = true
ed25519-dalek.workspace = true

# wasm-opt needs a binaryen newer than the distro's; the binding is ~130 KB
# unoptimized — optimization is cosmetic here. Local pack only (plan §K).
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
