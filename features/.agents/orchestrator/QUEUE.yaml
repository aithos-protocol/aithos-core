# Orchestrated feature train — order, policy, budgets.
#
# Read by `features/.agents/scripts/train-status.py`. This file and every
# `STATE.md` frontmatter use a deliberately restricted YAML subset — see
# `LEDGER.md`, section "Restricted grammar". The restriction is a feature: a
# state file an unattended orchestrator depends on must have exactly one
# reading.

version: 1

policy:
  # The train advances on its own and stops only on a blocking condition
  # listed in PROCESS.md, section "Blocking conditions".
  autonomy: until_blocked
  # Adversarial refutation panel size for every P1/P2 finding.
  # Ruled 2026-08-03 by the owner: 3. A 2-panel has no rule for a 1-1 split.
  refuters_per_finding: 3
  # A third rejection of the same finding stops the run.
  max_rejections_per_finding: 3
  # Branches are pushed to the public repository; the disclosure gate is
  # therefore a write gate, not a publication gate.
  durability_remote: origin
  run_branch_prefix: agents/train
  push_main: false
  disclosure_gate: true
  # Project stage, 2026-08-04. Nothing is deployed and no edition has been
  # published by anyone, so a change cannot invalidate any holder's data. Roles
  # do not weigh backward compatibility, propose migration paths, or soften a
  # correction to spare the past. Expires when a first edition is published
  # outside this repository or the crate leaves alpha; whoever does that flips
  # this key in the same change. Full statement in features/AGENTS.md.
  backward_compatibility_required: false
  backward_compatibility_expires_on: 'first published edition outside this repository, or leaving alpha'

budget:
  # Panel size is refuters_per_finding x (number of P1/P2 findings), so this
  # figure follows the finding yield, not the scenario count. Set to 300 by the
  # owner on 2026-08-03, after run 2026-08-03-r1 spent 55 on c-headers, whose
  # 8 scenarios yielded 16 P1/P2 findings. The headroom is meant to cover
  # f-gamma (74 scenarios) without a budget stop mid-panel.
  #
  # At this size the agent count stops being a guardrail and becomes a runaway
  # backstop. Wallclock is now the binding limit: raised 240 -> 600 so the two
  # do not contradict each other. A c-headers-sized cycle took ~105 min.
  agents_per_cycle: 300
  wallclock_minutes_per_cycle: 600

# Model per role. Set to opus everywhere by the owner on 2026-08-03. Run
# 2026-08-03-r1 ran I1 and G2 on sonnet: the warden nonetheless caught a real
# disclosure leak, a gate whose counters contradicted its declared scope, a
# stale summary-table cell, and the structural gap in the state model. Sonnet
# was not the weak link there; opus is the owner's call, not a fix.
models:
  inventory: opus
  pass_a: opus
  refuter: opus
  pass_b: opus
  corrector: opus
  reviewer: opus
  impact: opus
  warden: opus
  bootstrapper: opus

# Features are processed strictly in this order, one at a time. A feature whose
# STATE.md reports COMPLETE is skipped. A feature file present on disk but
# absent from this list and not COMPLETE is a state error.
order:
  - c-headers
  - g4-client-surfaces
  - d-bundle
  - h-merkle
  - e-mandates
  - e-mandate-sections
  - n-structural-mutations
  - i-concurrency
  - h2-gamma-roots
  - g-revocation
  - l-delegated-writes
  - m-delegated-editions
  - o-connector-classes-vault
  - g-plus-obligations
  - f-plus-constraints
  - f-gamma
  - k-integration

# Prior manual work the train must know about but must not treat as Pass A
# input. A yardstick is a Pass B input and a truth-milestone comparison only.
yardsticks:
  c-headers: codex/audit-c-headers

# Recorded consequences of accepted impact reviews. TARGETED means a future
# cycle of that feature owes specific scenarios; it never reopens a feature by
# itself.
follow_ups:
  b-derivation-round-2-targeted: [a-identity, c-headers, d-bundle, e-mandates, n-structural-mutations]
  bder-006-d-bundle: tag-view and wrap scenarios owed by the d-bundle cycle

  # Recorded by the c-headers impact review, 2026-08-04. No FULL_AUDIT.
  chdr-i3-targeted: [a-identity, d-bundle, g-revocation, g4-client-surfaces, k-integration, m-delegated-editions, n-structural-mutations, o-connector-classes-vault]
  chdr-i3-g4-cli: 'header-seal and header-open are unexercised by cli_surface.rs; the g4 cycle owes both, with one negative case pinning a foreign owner_kex (CHDR-035, CHDR-032)'
  chdr-i3-d-bundle: 'an edition pinning an I3-violating header must be refused by verify, and publish carries no such guard (CHDR-034, CHDR-030)'
  chdr-i3-g-revocation: 'a rotation must re-seal the owner line to the DID owner_kex, not to the key the previous owner line carried (spec 03.4, 05.5, 06.2); plus the to != kid survivor case (CHDR-029)'
  chdr-i3-n-structural: 'move_folder writes the index before the I3 guard and is not transactional (CHDR-031); structural_recipients resolves from the routing label (CHDR-029)'
  chdr-i3-o-vault: 'connector rotation resolves from the routing label (CHDR-029); read_vault_config_owner never validates (CHDR-030); e/x headers are now edition-verified'
  chdr-i3-k-integration: 'cold_verify gained the I3 pass and a new did.json precondition at height 1; the cold round-trip owes a mutilated-header defect row'
  chdr-i3-m-delegated: 'a delegated rotation reproducing a stale owner line invalidates the whole edition (spec 05-delegation.md:89-92)'
  chdr-i3-a-identity: 'keys.kex is now the field that defines I3; an identity-epoch transition has an unstated header consequence and no migration path. TARGETED, not a reopening of a COMPLETE feature'
  chdr-i3-cb2-pinning: 'revising one promoted vector costs four levels of pinning across the CB2 slice; g2-rotation.json still freezes the pre-variant-A wire form. Subject of any future lot is the CB2 cascade, never an I3 side effect'
  chdr-i3-versioning: 'five public aithos-core::header signatures broke and the at-rest header format broke; rust/Cargo.toml still reads 0.1.0-alpha.1 and CHANGELOG Unreleased names neither (CHDR-033)'
  chdr-i3-rewrite-vs-reverify: 'BLOCKING - spec 00-overview.md:82-83 forbids rewriting historical manifests while :89-90 re-verifies pre-revision editions. Replaces the retention-versus-retroactivity entry, which rested on a false reading of 03-headers 3.5. Owner ruling required'
  chdr-i3-epoch-dating: 'spec/03-headers.md:36-40 does not date the subject DID document against 01-identity-and-keys.md:116-119 and 00-overview.md:89-90: after an identity epoch, which epoch document does a verifier check an old edition against'
  chdr-i3-drop-retained-versions: 'spec/03-headers.md 3.5 drops old key versions under eager re-encryption; Header::rotate only inserts and no code path ever removes one. Spec permits, implementation does not do it'
  chdr-028: 'BLOCKING, embargo - routing requires naming the surface, which describes the mechanism. Held by the orchestrator; no target recorded here'

  # Spec consistency pass, 2026-08-04. Detail and proposed arbitrations in
  # docs/SPEC-CONSISTENCY-2026-08-04.md. Every arbitration is PROPOSED, NOT
  # IMPLEMENTED, and its feasibility has not been checked: a later correction
  # cycle owns that. 13 findings, 6 contradictions, 3 dead letters, 3
  # unreachable statements.
  spec-cons-01-gamma-layout: 'contradiction, both implemented - canonical location of the Gamma log, 02.3 against 07.1. Breaks a2-did.json and the signed bytes of every published did.json'
  spec-cons-02-aad-purposes: 'contradiction, textual - the AAD purpose inventory of 00.3 omits purposes the code uses'
  spec-cons-03-structure-vault-kinds: 'dead letter, I5 - the closed registry of 07.9.2 has no kind for structure or vault-config while 04.5.1 defines those families and 04.13 requires logging them. The code fills the gap with an undeclared payload key. H2 roots hash each line JCS, so no rewrite is possible'
  spec-cons-04-log-reads: 'contradiction, both implemented, I5 - log_reads parsed and mitigated on both sides'
  spec-cons-05-max-sessions: 'contradiction, spec against spec, published in full; the code-side gap is held out of repository under the disclosure gate'
  spec-cons-06-exactly-n-rotation: 'UNREACHABLE, I3 - 03.4:109 admits recipients absent from the previous version in the exactly-N case; check_rotation rejects every kid absent from prev without exception, so the 03.4:92-95 fallback cannot be taken. No vector covers it'
  spec-cons-07-rotation-authority: 'dead letter, I4 - 05.5:101 requires rejecting a rotation that drops a line the signer had no authority over. The signer does not enter check_rotation and no verifier calls it'
  spec-cons-08-uplink-author: 'UNREACHABLE, I4 - 03.4:112 requires rejecting an up-link wrap whose author does not hold P, but the Wrap struct carries neither author nor signature. The criterion is not in the wire. The vector required by 09.2:55 is absent'
  spec-cons-09-dead-letter-3: 'dead letter - see the document'
  spec-cons-10-contradiction-6: 'contradiction, textual - see the document'
  spec-cons-11-vault-header-path: 'UNREACHABLE, I3 - 02.3, 02.1 and 03.1 place the vault header outside the prefix is_header_file requires, so verify_pinned_headers never parses it. A spec-conformant implementation produces an edition whose pinned header escapes I3'
  spec-cons-12: 'BLOCKING, embargo - identifier and neutral title only. I4, contradiction, both implemented. Held by the orchestrator'
  spec-cons-13-create-verb: 'contradiction, textual - there is no wire verb create, against the K1.2 tables'
